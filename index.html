<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現場管理Pro</title>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
            --apple-sub: #86868b;
            --apple-blue: #0066cc;
            --apple-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "Helvetica Neue", sans-serif; background-color: var(--apple-bg); color: var(--apple-text); padding-bottom: 80px; }

        /* --- 印刷設定 --- */
        @media print {
            @page { size: A4; margin: 15mm; }
            nav, .no-print, .btn, .card, .input-section { display: none !important; }
            body { background: #fff; }
            .preview-wrapper { display: block !important; padding: 0 !important; height: auto !important; background: none !important; }
            .a4-page { 
                width: 100% !important; transform: none !important; margin: 0 !important; 
                box-shadow: none !important; position: static !important; display: block !important; 
                padding: 0 !important;
            }
            thead { display: table-header-group; } /* 2枚目以降も項目行を表示 */
        }

        /* プレビュー画面の設定 */
        .preview-wrapper { width: 100%; background: #525659; display: flex; justify-content: center; overflow: hidden; position: relative; min-height: 600px; border-radius: var(--apple-radius); }
        .a4-page { 
            width: 210mm; min-height: 297mm; padding: 15mm; background: white; flex-shrink: 0; 
            transform-origin: top center; position: absolute; top: 10px; left: 50%; transform: translateX(-50%) scale(0.45);
            color: #000; line-height: 1.5;
        }

        /* 請求書パーツ */
        .invoice-title { font-size: 32px; text-align: center; border-bottom: 3px solid #000; margin-bottom: 40px; font-weight: bold; letter-spacing: 15px; text-indent: 15px; }
        
        .inv-top-section { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        
        /* 請求先（左側） */
        .client-info { font-size: 18px; margin-top: 40px; border-bottom: 1px solid #000; width: 45%; font-weight: bold; padding-bottom: 5px; }

        /* 請求元（右側エリア・左詰め） */
        .issuer-info-container { width: 40%; text-align: left; position: relative; }
        .issuer-info-content { display: inline-block; text-align: left; position: relative; }
        
        .stamp-box {
            position: absolute;
            right: -35mm; /* 氏名の右側に配置 */
            top: -5mm;
            width: 25mm;
            height: 25mm;
            border: 1px dashed #ddd; /* 捺印ガイド（印刷時は非常に薄く、またはお好みで消してください） */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 10px;
        }

        .total-box { font-size: 22px; font-weight: bold; border-bottom: 4px double #000; padding: 10px 0; margin: 30px 0; display: flex; justify-content: space-between; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #000; padding: 8px; font-size: 12px; }
        th { background: #f2f2f2; text-align: center; }

        /* 入力UI */
        .container { max-width: 800px; margin: 0 auto; padding: 12px; }
        .card { background: #fff; padding: 20px; border-radius: var(--apple-radius); margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h3 { font-size: 16px; margin-bottom: 12px; color: var(--apple-sub); }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 16px; }
        
        nav { position: sticky; top: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); display: flex; padding: 5px; z-index: 100; border-bottom: 1px solid #ddd; }
        nav button { flex: 1; padding: 12px; border: none; background: none; color: var(--apple-sub); font-weight: bold; font-size: 14px; }
        nav button.active { color: var(--apple-blue); border-bottom: 2px solid var(--apple-blue); }
        
        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-primary { background: var(--apple-blue); color: #fff; }
        .hidden { display: none; }
    </style>
</head>
<body>

<nav>
    <button onclick="showPage('entry')" id="btn-entry" class="active">データ入力</button>
    <button onclick="showPage('invoice')" id="btn-invoice">請求書表示</button>
</nav>

<div class="container">
    <!-- 入力セクション -->
    <section id="page-entry">
        <div class="card">
            <h3>請求元（自分）の情報</h3>
            <input type="text" id="input-office" placeholder="屋号 (例: 〇〇工務店)" oninput="updatePreview()">
            <input type="text" id="input-name" placeholder="氏名 (例: 山田 太郎)" oninput="updatePreview()">
            <input type="text" id="input-address" placeholder="住所・連絡先" oninput="updatePreview()">
        </div>
        <div class="card">
            <h3>請求先の設定</h3>
            <input type="text" id="input-client" placeholder="請求先名 (例: 株式会社建設)" value="〇〇株式会社" oninput="updatePreview()">
        </div>
        <div class="card">
            <h3>売上登録</h3>
            <input type="date" id="date">
            <input type="text" id="site-name" placeholder="現場名">
            <input type="number" id="price" placeholder="金額">
            <button class="btn btn-primary" onclick="saveData()">保存して追加</button>
        </div>
    </section>

    <!-- 請求書表示セクション -->
    <section id="page-invoice" class="hidden">
        <div class="preview-wrapper">
            <div class="a4-page" id="inv-pdf">
                <div class="invoice-title">御請求書</div>
                
                <div class="inv-top-section">
                    <!-- 左側：請求先 -->
                    <div class="client-info" id="disp-client">
                        〇〇株式会社 御中
                    </div>

                    <!-- 右側：請求元（左詰めレイアウト） -->
                    <div class="issuer-info-container">
                        <div class="issuer-info-content">
                            <div id="disp-date" style="margin-bottom: 8px;">2026年5月2日</div>
                            <div id="disp-office" style="font-weight: bold; font-size: 1.2em; margin-bottom: 2px;">屋号未設定</div>
                            <div style="font-size: 1.1em; margin-bottom: 10px;">
                                <span id="disp-name">氏名未設定</span>
                                <span style="font-size: 0.8em; margin-left: 4px;">印</span>
                                <div class="stamp-box no-print">角印</div> <!-- 角印スペース -->
                            </div>
                            <div id="disp-address" style="font-size: 10px; line-height: 1.4; white-space: pre-wrap;">〒000-0000<br>〇〇県〇〇市1-2-3</div>
                        </div>
                    </div>
                </div>

                <div class="total-box">
                    <span>ご請求金額</span>
                    <span id="disp-total">¥0 -</span>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th style="width:15%">日付</th>
                            <th>摘要 (現場名)</th>
                            <th style="width:20%">金額</th>
                        </tr>
                    </thead>
                    <tbody id="inv-body">
                        <!-- ここにデータが入る -->
                    </tbody>
                </table>
            </div>
        </div>
        <div style="margin-top: 20px;">
            <button class="btn btn-primary" onclick="window.print()">印刷・PDFとして保存</button>
        </div>
    </section>
</div>

<script>
    let db;
    const req = indexedDB.open("InvoiceProDB", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("logs", {keyPath: "id", autoIncrement: true});
    req.onsuccess = e => { 
        db = e.target.result;
        const now = new Date();
        document.getElementById('date').value = now.toISOString().split('T')[0];
    };

    function showPage(p) {
        document.getElementById('page-entry').classList.toggle('hidden', p !== 'entry');
        document.getElementById('page-invoice').classList.toggle('hidden', p !== 'invoice');
        document.getElementById('btn-entry').classList.toggle('active', p === 'entry');
        document.getElementById('btn-invoice').classList.toggle('active', p === 'invoice');
        if(p === 'invoice') renderInvoice();
    }

    function updatePreview() {
        document.getElementById('disp-office').innerText = document.getElementById('input-office').value || "屋号未設定";
        document.getElementById('disp-name').innerText = document.getElementById('input-name').value || "氏名未設定";
        document.getElementById('disp-address').innerText = document.getElementById('input-address').value || "";
        document.getElementById('disp-client').innerText = (document.getElementById('input-client').value || "〇〇株式会社") + " 御中";
        
        const now = new Date();
        document.getElementById('disp-date').innerText = `発行日: ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
    }

    function saveData() {
        const site = document.getElementById('site-name').value;
        const price = parseInt(document.getElementById('price').value);
        if(!site || !price) return alert("現場名と金額を入力してください");

        const data = {
            date: document.getElementById('date').value,
            site: site,
            price: price
        };
        db.transaction("logs", "readwrite").objectStore("logs").add(data).onsuccess = () => {
            alert("データを追加しました");
            document.getElementById('site-name').value = "";
            document.getElementById('price').value = "";
        };
    }

    function renderInvoice() {
        db.transaction("logs").objectStore("logs").getAll().onsuccess = e => {
            const logs = e.target.result.sort((a,b) => a.date.localeCompare(b.date));
            let total = 0;
            const html = logs.map(l => {
                total += l.price;
                return `<tr>
                    <td style="text-align:center">${l.date.replace(/-/g, '/')}</td>
                    <td>${l.site}</td>
                    <td style="text-align:right">¥${l.price.toLocaleString()}</td>
                </tr>`;
            }).join('');
            document.getElementById('inv-body').innerHTML = html;
            document.getElementById('disp-total').innerText = `¥${total.toLocaleString()} -`;
            updatePreview();
        };
    }
</script>
</body>
</html>
