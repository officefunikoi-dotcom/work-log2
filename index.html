<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>現場管理Pro</title>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
            --apple-sub: #86868b;
            --apple-blue: #0066cc;
            --apple-radius: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro JP", "Hiragino Kaku Gothic ProN", sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            padding-bottom: 100px;
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* 固定ナビ */
        nav {
            position: sticky; top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-around;
            padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.1); z-index: 2000;
        }
        nav button {
            background: none; border: none; font-size: 13px; font-weight: 500;
            color: var(--apple-sub); cursor: pointer; flex: 1; padding: 5px 0;
        }
        nav button.active { color: var(--apple-text); font-weight: 700; border-bottom: 2px solid var(--apple-text); }

        .container { max-width: 800px; margin: 0 auto; padding: 12px; }
        
        .card {
            background: var(--apple-card); padding: 18px;
            border-radius: var(--apple-radius); margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h2 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 15px; }
        h3 { font-size: 16px; margin-bottom: 12px; border-left: 4px solid var(--apple-blue); padding-left: 8px; }

        /* フォーム部品 */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--apple-sub); margin-bottom: 4px; }
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d2d2d7;
            font-size: 16px; background: #fff; appearance: none; -webkit-appearance: none;
        }
        
        /* 出張手当チェックボックスの反応を改善 */
        .checkbox-container {
            display: flex; align-items: center; gap: 10px; padding: 12px;
            background: #fafafa; border-radius: 10px; border: 1px solid #d2d2d7; cursor: pointer;
        }
        .checkbox-container input[type="checkbox"] {
            width: 24px; height: 24px; appearance: checkbox; -webkit-appearance: checkbox; flex-shrink: 0;
        }

        .member-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .member-chip {
            padding: 8px 12px; border-radius: 18px; background: #f0f0f2;
            font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        .member-chip.selected { background: var(--apple-blue); color: #fff; font-weight: 600; }

        .btn {
            display: block; width: 100%; padding: 15px; border-radius: var(--apple-radius);
            font-size: 16px; font-weight: 600; text-align: center; border: none; cursor: pointer; margin-bottom: 8px;
        }
        .btn-primary { background: var(--apple-blue); color: white; }
        .btn-secondary { background: #e8e8ed; color: var(--apple-text); }
        .btn-danger { background: #ff3b30; color: white; padding: 4px 8px; font-size: 11px; border-radius: 6px; width: auto; }

        /* iPhone用プレビュー調整 */
        .preview-outer {
            width: 100%; overflow: hidden; background: #e8e8ed;
            border-radius: var(--apple-radius); padding: 5px; margin-bottom: 10px;
            display: flex; justify-content: center;
        }
        .a4-page {
            width: 210mm; min-height: 297mm; padding: 15mm; background: white;
            color: #000; flex-shrink: 0; transform-origin: top center;
        }

        /* スマホ画面でA4を縮小表示 */
        @media screen and (max-width: 850px) {
            .a4-page {
                transform: scale(calc((100vw - 34px) / 210));
                margin-bottom: calc(-297mm * (1 - ((100vw - 34px) / 210)));
            }
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        th, td { border: 1px solid #000; padding: 6px; font-size: 10px; text-align: left; word-wrap: break-word; }
        th { background: #f2f2f2; }

        .invoice-title { font-size: 24px; text-align: center; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 20px; font-weight: bold; letter-spacing: 10px; }
        .total-box { font-size: 18px; font-weight: bold; border-bottom: 4px double #000; padding: 5px 0; margin: 15px 0; display: flex; justify-content: space-between; }
        .bank-info { border: 1px solid #000; padding: 8px; margin-top: 10px; font-size: 10px; white-space: pre-wrap; width: 100%; }

        #toast { 
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%); 
            background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; 
            border-radius: 20px; opacity: 0; transition: 0.3s; z-index: 3000; font-size: 14px;
        }
        .hidden { display: none; }

        @media print {
            nav, .no-print, .btn, #toast, .card { display: none !important; }
            body { background: #fff; padding: 0; }
            .preview-outer { display: block; background: none; padding: 0; }
            .a4-page { width: 100%; box-shadow: none; transform: none !important; margin: 0; padding: 10mm; }
        }
    </style>
</head>
<body>

<nav id="main-nav">
    <button onclick="showPage('entry')" class="active">日報入力</button>
    <button onclick="showPage('attendance')">出勤簿</button>
    <button onclick="showPage('invoice')">請求書</button>
    <button onclick="showPage('settings')">設定</button>
</nav>

<div class="container">
    <section id="page-entry">
        <div class="card">
            <h2>日報入力</h2>
            <input type="hidden" id="edit-id">
            <div class="form-group"><label>日付</label><input type="date" id="date"></div>
            <div class="form-group"><label>現場名</label><input type="text" id="site-name" placeholder="現場名" list="site-list"><datalist id="site-list"></datalist></div>
            <div class="form-group"><label>同行メンバー</label><div id="member-selector" class="member-list"></div></div>
            <div class="form-group">
                <label>勤務区分</label>
                <select id="work-type" onchange="toggleOvertime()">
                    <option value="定時終了">定時終了</option>
                    <option value="残業">残業あり</option>
                    <option value="移動日100">移動日 (100%)</option>
                    <option value="移動日50">移動日 (50%)</option>
                </select>
            </div>
            <div id="overtime-wrap" class="form-group" style="display:none"><label>残業時間</label><input type="number" id="overtime-hours" step="0.5" value="0"></div>
            <div class="form-group"><label>基本日当 (税込)</label><input type="number" id="base-wage"></div>
            <div class="form-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="is-trip">
                    <span>出張手当を追加</span>
                </label>
            </div>
            <div class="form-group"><label>経費 (非課税)</label><input type="number" id="expenses" value="0"></div>
            <div class="form-group"><label>メモ</label><textarea id="memo" rows="2"></textarea></div>
            <button class="btn btn-primary" onclick="confirmSave()">登録 ＆ LINEコピー</button>
            <button id="cancel-edit" class="btn btn-secondary" style="display:none" onclick="clearEntryForm()">編集キャンセル</button>
        </div>
    </section>

    <section id="page-attendance" class="hidden">
        <div class="card no-print">
            <label>表示月</label><input type="month" id="att-month" onchange="renderAttendance()">
        </div>
        <div class="preview-outer">
            <div class="a4-page">
                <h2 id="att-title" style="margin-top:0;"></h2>
                <table>
                    <thead><tr><th style="width:12%">日付</th><th style="width:25%">現場名</th><th style="width:25%">人員</th><th style="width:13%">区分</th><th>メモ</th><th class="no-print" style="width:12%">操作</th></tr></thead>
                    <tbody id="att-body"></tbody>
                </table>
            </div>
        </div>
        <button class="btn btn-secondary no-print" onclick="window.print()">印刷 / PDF保存</button>
    </section>

    <section id="page-invoice" class="hidden">
        <div class="card no-print">
            <label>請求月</label><input type="month" id="inv-month" onchange="renderInvoice()">
        </div>
        <div class="preview-outer">
            <div class="a4-page">
                <div class="invoice-title">請求書</div>
                <div style="display:flex; justify-content:space-between; font-size:11px;">
                    <div>
                        <div id="disp-c-addr"></div>
                        <div id="disp-c-name" style="font-size:15px; border-bottom:1px solid #000; min-width:180px; padding:3px 0; font-weight:bold; margin-bottom:5px;"></div>
                        <div>下記の通り、ご請求申し上げます。</div>
                    </div>
                    <div style="text-align:right">
                        <div id="disp-date"></div>
                        <div id="disp-m-name" style="font-weight:bold; font-size:13px; margin-top:3px;"></div>
                        <div id="disp-m-addr" style="font-size:9px"></div>
                        <div id="disp-m-tel" style="font-size:9px"></div>
                    </div>
                </div>
                <div class="total-box"><span>ご請求金額</span><span id="disp-total"></span></div>
                <table>
                    <thead><tr><th style="width:15%">日付</th><th>現場名・摘要</th><th style="width:20%">備考</th><th style="width:20%">単価 (税抜)</th></tr></thead>
                    <tbody id="inv-body"></tbody>
                    <tfoot>
                        <tr><td colspan="3" style="text-align:right; font-weight:bold;">小計 (税抜)</td><td id="inv-subtotal" style="text-align:right"></td></tr>
                        <tr><td colspan="3" style="text-align:right; font-weight:bold;">消費税 (10%)</td><td id="inv-tax" style="text-align:right"></td></tr>
                        <tr><td colspan="3" style="text-align:right; font-weight:bold; background:#f2f2f2;">合計 (税込)</td><td id="inv-grand-total" style="text-align:right; font-weight:bold; background:#f2f2f2;"></td></tr>
                    </tfoot>
                </table>
                <div class="bank-info" id="disp-bank"></div>
            </div>
        </div>
        <button class="btn btn-secondary no-print" onclick="window.print()">印刷 / PDF保存</button>
    </section>

    <section id="page-settings" class="hidden">
        <div class="card">
            <h3>同行者名簿</h3>
            <div style="display:flex; gap:8px; margin-bottom:10px;"><input type="text" id="new-member" placeholder="氏名"><button class="btn btn-primary" style="width:70px; padding:0;" onclick="addMember()">追加</button></div>
            <div id="settings-member-list"></div>
        </div>
        <div class="card">
            <h3>金額設定</h3>
            <div class="form-group"><label>標準日当 (税込)</label><input type="number" id="set-base-wage" onchange="saveConfig()"></div>
            <div class="form-group"><label>出張手当 (税込)</label><input type="number" id="set-trip-pay" onchange="saveConfig()"></div>
        </div>
        <div class="card">
            <h3>請求情報</h3>
            <div class="form-group"><label>請求先 会社名</label><input type="text" id="set-c-name" onchange="saveConfig()"></div>
            <div class="form-group"><label>請求先 住所</label><input type="text" id="set-c-addr" onchange="saveConfig()"></div>
            <div class="form-group"><label>請求元 氏名</label><input type="text" id="set-m-name" onchange="saveConfig()"></div>
            <div class="form-group"><label>請求元 住所</label><input type="text" id="set-m-addr" onchange="saveConfig()"></div>
            <div class="form-group"><label>電話番号</label><input type="text" id="set-m-tel" onchange="saveConfig()"></div>
            <div class="form-group"><label>振込先情報</label><textarea id="set-bank" rows="3" onchange="saveConfig()"></textarea></div>
        </div>
        <div class="card">
            <h3>バックアップ</h3>
            <button class="btn btn-primary" onclick="exportData()">データを書き出す</button>
            <button class="btn btn-secondary" onclick="importData()">データを読み込む</button>
        </div>
    </section>
</div>

<div id="toast"></div>

<script>
    let db;
    const request = indexedDB.open("FieldProA4_v11", 1);

    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore("logs", { keyPath: "id", autoIncrement: true });
        db.createObjectStore("config", { keyPath: "key" });
        db.createObjectStore("members", { keyPath: "name" });
    };

    request.onsuccess = (e) => {
        db = e.target.result;
        loadConfig().then(() => init());
    };

    function init() {
        const now = new Date();
        document.getElementById('date').value = now.toISOString().split('T')[0];
        document.getElementById('att-month').value = now.toISOString().substring(0, 7);
        document.getElementById('inv-month').value = now.toISOString().substring(0, 7);
        renderMemberSelector();
        updateSiteDatalist();
    }

    function showPage(p) {
        document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
        document.getElementById('page-' + p).classList.remove('hidden');
        document.querySelectorAll('#main-nav button').forEach(b => {
            b.classList.remove('active');
            if(b.getAttribute('onclick').includes(p)) b.classList.add('active');
        });
        if(p === 'attendance') renderAttendance();
        if(p === 'invoice') renderInvoice();
        if(p === 'settings') renderSettingsMembers();
    }

    function getLastName(n) { return n ? n.trim().split(/[ 　]/)[0] : ""; }

    function toggleOvertime() {
        document.getElementById('overtime-wrap').style.display = (document.getElementById('work-type').value === '残業') ? 'block' : 'none';
    }

    function confirmSave() { if(confirm("登録しますか？")) saveLog(); }

    async function saveLog() {
        const id = document.getElementById('edit-id').value;
        const date = document.getElementById('date').value;
        const site = document.getElementById('site-name').value;
        const type = document.getElementById('work-type').value;
        const ot = parseFloat(document.getElementById('overtime-hours').value) || 0;
        const base = parseInt(document.getElementById('base-wage').value) || 0;
        const exp = parseInt(document.getElementById('expenses').value) || 0;
        const tripCheck = document.getElementById('is-trip').checked;
        const members = Array.from(document.querySelectorAll('#member-selector .member-chip.selected')).map(el => el.innerText);
        const memo = document.getElementById('memo').value;

        if(!site) return alert("現場名を入力してください");

        const conf = await new Promise(r => db.transaction("config").objectStore("config").get("main").onsuccess = e => r(e.target.result?.value || {}));
        const tripAmount = tripCheck ? parseInt(conf.tripPay || 1000) : 0;

        let total = (type === '移動日50') ? base * 0.5 : base;
        if(type === '残業') total += Math.floor((base / 8) * 1.25 * ot);
        total += exp + tripAmount;

        const data = { date, site, type, ot, base, exp, tripAmount, members, total, memo, month: date.substring(0,7) };
        if(id) data.id = parseInt(id);

        db.transaction("logs", "readwrite").objectStore("logs").put(data).onsuccess = () => {
            copyToLine(data, conf.mName || "自分");
            clearEntryForm();
            showToast("保存完了 ＆ コピーしました");
            updateSiteDatalist();
        };
    }

    function copyToLine(d, myName) {
        const dt = new Date(d.date);
        const dateStr = `${dt.getMonth()+1}/${dt.getDate()}`;
        const membersStr = [getLastName(myName), ...d.members.map(getLastName)].join(' ');
        const count = d.members.length + 1;
        const msg = `${dateStr} ${d.site} ${membersStr} ${count}名 ${d.type === '残業' ? '残業'+d.ot+'時間' : d.type}です。`;
        
        const area = document.createElement("textarea");
        area.value = msg; document.body.appendChild(area);
        area.select(); document.execCommand("copy");
        document.body.removeChild(area);
    }

    function renderAttendance() {
        const m = document.getElementById('att-month').value;
        const [y, mm] = m.split('-');
        document.getElementById('att-title').innerText = `${y}年${parseInt(mm)}月 出勤記録`;

        db.transaction("logs", "readonly").objectStore("logs").getAll().onsuccess = (e) => {
            const logs = e.target.result.filter(l => l.month === m).sort((a,b) => a.date.localeCompare(b.date));
            db.transaction("config").objectStore("config").get("main").onsuccess = (ec) => {
                const myName = getLastName(ec.target.result?.value.mName || "自分");
                document.getElementById('att-body').innerHTML = logs.map(l => `
                    <tr>
                        <td>${l.date.substring(5).replace('-','/')}</td>
                        <td>${l.site}</td>
                        <td>${[myName, ...l.members.map(getLastName)].join(' ')}</td>
                        <td>${l.type === '残業' ? l.ot+'h' : l.type}</td>
                        <td>${l.memo}</td>
                        <td class="no-print">
                            <span onclick="editLog(${l.id})" style="color:var(--apple-blue); font-size:9px;">修正</span>
                            <span onclick="deleteLog(${l.id})" style="color:#ff3b30; font-size:9px; margin-left:5px;">削除</span>
                        </td>
                    </tr>`).join('');
            };
        };
    }

    function renderInvoice() {
        const m = document.getElementById('inv-month').value;
        db.transaction("config", "readonly").objectStore("config").get("main").onsuccess = (ec) => {
            const c = ec.target.result?.value || {};
            document.getElementById('disp-c-name').innerText = (c.cName || "") + " 御中";
            document.getElementById('disp-c-addr').innerText = c.cAddr || "";
            document.getElementById('disp-m-name').innerText = c.mName || "";
            document.getElementById('disp-m-addr').innerText = c.mAddr || "";
            document.getElementById('disp-m-tel').innerText = c.mTel || "";
            document.getElementById('disp-bank').innerText = "【お振込先】\n" + (c.bank || "");
            document.getElementById('disp-date').innerText = "発行日: " + new Date().toLocaleDateString();

            db.transaction("logs", "readonly").objectStore("logs").getAll().onsuccess = (el) => {
                const logs = el.target.result.filter(l => l.month === m).sort((a,b) => a.date.localeCompare(b.date));
                let subTotal = 0; let gTotal = 0;
                document.getElementById('inv-body').innerHTML = logs.map(l => {
                    const lineSub = Math.ceil((l.total - l.exp) / 1.1) + l.exp;
                    subTotal += lineSub; gTotal += l.total;
                    return `<tr><td>${l.date.replace(/-/g,'/')}</td><td>${l.site}</td><td>${l.type}</td><td style="text-align:right">¥${lineSub.toLocaleString()}</td></tr>`;
                }).join('');
                document.getElementById('disp-total').innerText = "¥ " + gTotal.toLocaleString() + " -";
                document.getElementById('inv-subtotal').innerText = "¥" + subTotal.toLocaleString();
                document.getElementById('inv-tax').innerText = "¥" + (gTotal - subTotal).toLocaleString();
                document.getElementById('inv-grand-total').innerText = "¥" + gTotal.toLocaleString();
            };
        };
    }

    function editLog(id) {
        db.transaction("logs", "readonly").objectStore("logs").get(id).onsuccess = (e) => {
            const l = e.target.result;
            showPage('entry');
            document.getElementById('edit-id').value = l.id;
            document.getElementById('date').value = l.date;
            document.getElementById('site-name').value = l.site;
            document.getElementById('work-type').value = l.type;
            document.getElementById('overtime-hours').value = l.ot;
            document.getElementById('base-wage').value = l.base;
            document.getElementById('expenses').value = l.exp;
            document.getElementById('is-trip').checked = l.tripAmount > 0;
            document.getElementById('memo').value = l.memo;
            document.getElementById('cancel-edit').style.display = "block";
            toggleOvertime();
            document.querySelectorAll('#member-selector .member-chip').forEach(el => {
                el.classList.toggle('selected', l.members.includes(el.innerText));
            });
            window.scrollTo(0,0);
        };
    }

    function deleteLog(id) {
        if(confirm("削除しますか？")) {
            db.transaction("logs", "readwrite").objectStore("logs").delete(id).onsuccess = renderAttendance;
        }
    }

    function addMember() {
        const name = document.getElementById('new-member').value.trim();
        if(!name) return;
        db.transaction("members", "readwrite").objectStore("members").put({name}).onsuccess = () => {
            document.getElementById('new-member').value = "";
            renderSettingsMembers(); renderMemberSelector();
        };
    }

    function renderMemberSelector() {
        db.transaction("members", "readonly").objectStore("members").getAll().onsuccess = (e) => {
            document.getElementById('member-selector').innerHTML = e.target.result.map(m => `<div class="member-chip" onclick="this.classList.toggle('selected')">${m.name}</div>`).join('');
        };
    }

    function renderSettingsMembers() {
        db.transaction("members", "readonly").objectStore("members").getAll().onsuccess = (e) => {
            document.getElementById('settings-member-list').innerHTML = e.target.result.map(m => `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px; background:#f5f5f7; padding:10px; border-radius:10px;">
                    <span>${m.name}</span><button class="btn-danger" onclick="deleteMember('${m.name}')">削除</button>
                </div>`).join('');
        };
    }

    function deleteMember(name) {
        db.transaction("members", "readwrite").objectStore("members").delete(name).onsuccess = () => { renderSettingsMembers(); renderMemberSelector(); };
    }

    function saveConfig() {
        const conf = {
            baseWage: document.getElementById('set-base-wage').value,
            tripPay: document.getElementById('set-trip-pay').value,
            cName: document.getElementById('set-c-name').value,
            cAddr: document.getElementById('set-c-addr').value,
            mName: document.getElementById('set-m-name').value,
            mAddr: document.getElementById('set-m-addr').value,
            mTel: document.getElementById('set-m-tel').value,
            bank: document.getElementById('set-bank').value
        };
        db.transaction("config", "readwrite").objectStore("config").put({ key: "main", value: conf });
    }

    async function loadConfig() {
        return new Promise(r => {
            db.transaction("config", "readonly").objectStore("config").get("main").onsuccess = (e) => {
                if (e.target.result) {
                    const v = e.target.result.value;
                    document.getElementById('set-base-wage').value = v.baseWage || 18000;
                    document.getElementById('set-trip-pay').value = v.tripPay || 1000;
                    document.getElementById('base-wage').value = v.baseWage || 18000;
                    document.getElementById('set-c-name').value = v.cName || "";
                    document.getElementById('set-c-addr').value = v.cAddr || "";
                    document.getElementById('set-m-name').value = v.mName || "";
                    document.getElementById('set-m-addr').value = v.mAddr || "";
                    document.getElementById('set-m-tel').value = v.mTel || "";
                    document.getElementById('set-bank').value = v.bank || "";
                }
                r();
            };
        });
    }

    function updateSiteDatalist() {
        db.transaction("logs", "readonly").objectStore("logs").getAll().onsuccess = (e) => {
            const sites = [...new Set(e.target.result.map(l => l.site))];
            document.getElementById('site-list').innerHTML = sites.map(s => `<option value="${s}">`).join('');
        };
    }

    function exportData() {
        const data = {};
        const stores = ["logs", "config", "members"];
        let count = 0;
        stores.forEach(s => {
            db.transaction(s, "readonly").objectStore(s).getAll().onsuccess = (e) => {
                data[s] = e.target.result;
                count++;
                if(count === stores.length) {
                    const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url; a.download = `GenbaPro_Backup.json`; a.click();
                }
            };
        });
    }

    function importData() {
        const input = document.createElement("input");
        input.type = "file";
        input.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (re) => {
                const data = JSON.parse(re.target.result);
                Object.keys(data).forEach(s => {
                    const tx = db.transaction(s, "readwrite");
                    data[s].forEach(item => tx.objectStore(s).put(item));
                });
                alert("復元完了。再読み込みします。"); location.reload();
            };
            reader.readAsText(e.target.files[0]);
        };
        input.click();
    }

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 2000);
    }

    function clearEntryForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('site-name').value = "";
        document.getElementById('memo').value = "";
        document.getElementById('expenses').value = "0";
        document.getElementById('is-trip').checked = false;
        document.getElementById('cancel-edit').style.display = "none";
        document.querySelectorAll('#member-selector .member-chip').forEach(el => el.classList.remove('selected'));
        init();
    }
</script>
</body>
